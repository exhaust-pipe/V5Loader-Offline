name: Build Windows Native Pathfinder JNI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-builder:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            java_arch: x64
            java_version: 25
            cmake_arch: x64
          - arch: arm64
            runner: windows-11-arm
            java_arch: aarch64
            # Temurin 25 is unavailable on Windows ARM64; JNI only needs the stable JDK headers and import libraries.
            java_version: 21
            cmake_arch: ARM64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Java for JNI
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
          architecture: ${{ matrix.java_arch }}

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S NativeSrc -B NativeSrc/build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          cmake --build NativeSrc/build --config Release --parallel

      - name: Stage native cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/windows/${{ matrix.arch }} | Out-Null
          Copy-Item NativeSrc/build/Release/V5PathJNI.dll artifact/windows/${{ matrix.arch }}/V5PathJNI.dll -Force

      - name: Cache Windows native for caller
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: artifact/windows/${{ matrix.arch }}
          key: v5-native-run-${{ github.run_id }}-windows-${{ matrix.arch }}
          enableCrossOsArchive: true
