name: Build Android Native Libraries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-builder:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
          - abi: x86_64
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout matching LWJGL sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: LWJGL/lwjgl3
          ref: b800ccffab14396fc529ddb6c931b7c5c5226763 # 3.4.1
          path: .lwjgl-nanovg
          persist-credentials: false
          sparse-checkout: |
            modules/lwjgl/core/src/main/c
            modules/lwjgl/nanovg/src
            modules/lwjgl/stb/src/main/c

      - name: Check Java and native binding versions
        run: |
          python3 - <<'PY'
          import tomllib
          with open("gradle/libs.versions.toml", "rb") as file:
              version = tomllib.load(file)["versions"]["lwjgl"]
          if version != "3.4.1":
              raise SystemExit("Update the pinned LWJGL source commit with the Java binding version")
          PY

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build native libraries
        run: |
          cmake -S NativeSrc -B "NativeSrc/build-${{ matrix.arch }}" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DV5_LWJGL_SOURCE_DIR="$GITHUB_WORKSPACE/.lwjgl-nanovg" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "NativeSrc/build-${{ matrix.arch }}" --config Release --parallel

      - name: Stage native cache
        run: |
          mkdir -p "artifact/android/${{ matrix.arch }}"
          cp "NativeSrc/build-${{ matrix.arch }}/V5PathJNI.so" "artifact/android/${{ matrix.arch }}/"
          cp "NativeSrc/build-${{ matrix.arch }}/nanovg/liblwjgl_nanovg.so" "artifact/android/${{ matrix.arch }}/"

      - name: Cache Android natives for caller
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: artifact/android/${{ matrix.arch }}
          key: v5-native-run-${{ github.run_id }}-android-${{ matrix.arch }}
