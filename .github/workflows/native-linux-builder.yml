name: Build Linux Native Pathfinder JNI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-builder:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            java_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            java_arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25
          architecture: ${{ matrix.java_arch }}

      - name: Build native library
        run: |
          cmake -S NativeSrc -B NativeSrc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build NativeSrc/build --config Release --parallel

      - name: Stage native cache
        run: |
          mkdir -p artifact/linux/${{ matrix.arch }}
          cp NativeSrc/build/V5PathJNI.so artifact/linux/${{ matrix.arch }}/V5PathJNI.so

      - name: Cache Linux native for caller
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: artifact/linux/${{ matrix.arch }}
          key: v5-native-run-${{ github.run_id }}-linux-${{ matrix.arch }}
