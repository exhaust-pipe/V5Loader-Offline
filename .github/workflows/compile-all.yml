name: Rebuild JNI

on:
  push:
    branches:
      - "**"
    paths:
      - "NativeSrc/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    permissions:
      contents: read
    uses: ./.github/workflows/native-linux-builder.yml

  macos:
    permissions:
      contents: read
    uses: ./.github/workflows/native-macos-builder.yml

  windows:
    permissions:
      contents: read
    uses: ./.github/workflows/native-windows-builder.yml

  bundle:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download Linux native
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-linux-x86_64
          path: artifact/linux/x86_64

      - name: Download macOS natives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-macos
          path: artifact/macos

      - name: Download Windows native
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-windows-x86_64
          path: artifact/windows/x86_64

      - name: Install native libraries
        shell: bash
        run: |
          set -euo pipefail
          DEST=src/main/resources/assets/v5/natives
          mkdir -p "$DEST/linux/x86_64" "$DEST/macos/arm64" "$DEST/macos/x86_64" "$DEST/windows/x86_64"
          cp artifact/linux/x86_64/V5PathJNI.so "$DEST/linux/x86_64/V5PathJNI.so"
          cp artifact/macos/arm64/V5PathJNI.dylib "$DEST/macos/arm64/V5PathJNI.dylib"
          cp artifact/macos/x86_64/V5PathJNI.dylib "$DEST/macos/x86_64/V5PathJNI.dylib"
          cp artifact/windows/x86_64/V5PathJNI.dll "$DEST/windows/x86_64/V5PathJNI.dll"

      - name: Commit updated JNI artifacts
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/v5/natives/
          if git diff --cached --quiet; then
            echo "JNI artifacts are already up to date."
            exit 0
          fi
          SOURCE_SHORT="${SOURCE_SHA:0:12}"
          SOURCE_SUBJECT="$(git log -1 --pretty=%s "$SOURCE_SHA")"
          git commit -m "chore(native): rebuild JNI artifacts for ${SOURCE_SHORT}" \
            -m "Source-Commit: ${SOURCE_SHA}" \
            -m "Source-Message: ${SOURCE_SUBJECT}"
          git fetch origin "$BRANCH"
          REMOTE_SHA="$(git rev-parse "origin/$BRANCH")"
          if [[ "$REMOTE_SHA" != "$SOURCE_SHA" ]]; then
            if ! git diff --quiet "$SOURCE_SHA" "$REMOTE_SHA" -- NativeSrc/; then
              echo "::error::NativeSrc changed again while this build was running. Refusing to commit stale JNI artifacts."
              exit 1
            fi
            git rebase "$REMOTE_SHA"
          fi
          git push origin HEAD:"$BRANCH"
