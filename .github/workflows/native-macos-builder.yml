name: Build macOS Native Pathfinder JNI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-builder:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25

      - name: Build arm64 native library
        run: |
          cmake -S NativeSrc -B NativeSrc/build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build NativeSrc/build-arm64 --config Release --parallel

      - name: Build x86_64 native library
        run: |
          cmake -S NativeSrc -B NativeSrc/build-x86_64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build NativeSrc/build-x86_64 --config Release --parallel

      - name: Stage native cache
        run: |
          mkdir -p artifact/macos/arm64 artifact/macos/x86_64
          cp NativeSrc/build-arm64/V5PathJNI.dylib artifact/macos/arm64/V5PathJNI.dylib
          cp NativeSrc/build-x86_64/V5PathJNI.dylib artifact/macos/x86_64/V5PathJNI.dylib
          lipo -info artifact/macos/arm64/V5PathJNI.dylib
          lipo -info artifact/macos/x86_64/V5PathJNI.dylib

      - name: Cache macOS natives for caller
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: artifact/macos
          key: v5-native-run-${{ github.run_id }}-macos
