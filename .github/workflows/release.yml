name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: [26.1.2, 26.2]

    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25

      - name: Build tagged release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon :${{ matrix.minecraft }}:build -PreleaseBuild -Pmod_version="$TAG"

      - name: Stage release asset
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "versions/${MC_VERSION}/build/libs/V5-Offline-${TAG}-${MC_VERSION}.jar" release-assets/

      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.minecraft }}
          path: release-assets/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.jar --clobber
          else
            gh release create "$TAG" release-assets/*.jar --verify-tag --title "$TAG" --generate-notes
          fi
