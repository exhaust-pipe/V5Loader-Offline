name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-linux:
    name: Build JNI Linux
    permissions:
      contents: read
    uses: ./.github/workflows/native-linux-builder.yml

  native-macos:
    name: Build JNI macOS
    permissions:
      contents: read
    uses: ./.github/workflows/native-macos-builder.yml

  native-windows:
    name: Build JNI Windows
    permissions:
      contents: read
    uses: ./.github/workflows/native-windows-builder.yml

  native-bundle:
    name: Prepare release JNI bundle
    needs: [native-linux, native-macos, native-windows]
    runs-on: ubuntu-24.04
    outputs:
      key: v5-native-run-${{ github.run_id }}-bundle

    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore Linux native cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: artifact/linux/x86_64
          key: v5-native-run-${{ github.run_id }}-linux-x86_64
          fail-on-cache-miss: true

      - name: Restore macOS native cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: artifact/macos
          key: v5-native-run-${{ github.run_id }}-macos
          fail-on-cache-miss: true

      - name: Restore Windows native cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: artifact/windows/x86_64
          key: v5-native-run-${{ github.run_id }}-windows-x86_64
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Install JNI bundle
        shell: bash
        run: |
          set -euo pipefail
          DEST=src/main/resources/assets/v5/natives
          rm -rf "$DEST"
          mkdir -p "$DEST/linux/x86_64" "$DEST/macos/arm64" "$DEST/macos/x86_64" "$DEST/windows/x86_64"
          cp artifact/linux/x86_64/V5PathJNI.so "$DEST/linux/x86_64/V5PathJNI.so"
          cp artifact/macos/arm64/V5PathJNI.dylib "$DEST/macos/arm64/V5PathJNI.dylib"
          cp artifact/macos/x86_64/V5PathJNI.dylib "$DEST/macos/x86_64/V5PathJNI.dylib"
          cp artifact/windows/x86_64/V5PathJNI.dll "$DEST/windows/x86_64/V5PathJNI.dll"

      - name: Cache release JNI bundle for build jobs
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: src/main/resources/assets/v5/natives
          key: v5-native-run-${{ github.run_id }}-bundle

  build:
    name: Build Minecraft ${{ matrix.minecraft }}
    needs: native-bundle
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: [26.1.2, 26.2]

    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml') }}"
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore release JNI bundle
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: src/main/resources/assets/v5/natives
          key: ${{ needs.native-bundle.outputs.key }}
          fail-on-cache-miss: true

      - name: Build tagged release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon :${{ matrix.minecraft }}:build -PreleaseBuild -Pmod_version="$TAG"

      - name: Stage release asset
        id: artifact
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="V5-Offline-${TAG}-${MC_VERSION}"
          mkdir -p release-assets
          cp "versions/${MC_VERSION}/build/libs/${ARTIFACT_NAME}.jar" "release-assets/${ARTIFACT_NAME}.jar"
          echo "name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release-assets/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: V5-Offline-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.jar --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/*.jar \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi
