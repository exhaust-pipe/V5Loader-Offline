name: Build

on:
  push:
    branches:
      - "**"
    paths:
      - "src/main/java/**"
      - "src/main/kotlin/**"
      - "src/main/resources/**"
      - "!src/main/resources/assets/v5/natives/**"
      - "typing-generator/src/**"
  pull_request:
    paths:
      - "src/main/java/**"
      - "src/main/kotlin/**"
      - "src/main/resources/**"
      - "!src/main/resources/assets/v5/natives/**"
      - "typing-generator/src/**"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/*.versions.toml') }}"
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: bash ./gradlew --no-daemon build

      - name: Resolve build artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          MC_VERSION="$(sed -nE 's/^minecraft = "([^"]+)"/\1/p' gradle/libs.versions.toml)"
          MOD_VERSION="$(sed -n 's/^mod_version *= *//p' gradle.properties | tr -d '\r')"
          JAR="build/libs/V5-Offline-${MOD_VERSION}-${MC_VERSION}.jar"
          test -f "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=V5-Offline-${MOD_VERSION}-${MC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
